name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain the workspace is written for (rust-version in Cargo.toml).
  # Raised deliberately: a newer clippy can bring new lints.
  RUST_TOOLCHAIN: "1.95"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: clippy

    - uses: Swatinem/rust-cache@v2

    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Test
      run: cargo test --workspace --locked

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}

    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release --locked -p loanmaster

    - name: Check that the program starts
      run: |
        # Windows refuses to start a program that imports a function it
        # cannot find (the first 2.0 builds asked comctl32 for
        # TaskDialogIndirect), which building alone does not show.
        $p = Start-Process target/release/loanmaster.exe -ArgumentList '--version' -RedirectStandardOutput version.txt -PassThru
        $null = $p.Handle
        if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'LoanMaster did not exit within a minute of starting.' }
        if ($p.ExitCode -ne 0) { throw ('LoanMaster could not start: exit code 0x{0:X8}' -f $p.ExitCode) }
        Get-Content version.txt

    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress
        echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

    - name: Build Installer (Inno Setup)
      run: iscc setup.iss

    - name: Collect the portable copy
      run: |
        New-Item -ItemType Directory -Force build/LoanMaster | Out-Null
        Copy-Item target/release/loanmaster.exe build/LoanMaster/LoanMaster.exe

    - name: Upload Artifact - Portable Folder
      uses: actions/upload-artifact@v7
      with:
        name: LoanMaster-Portable
        path: build/LoanMaster

    - name: Upload Artifact - Installer
      uses: actions/upload-artifact@v7
      with:
        name: LoanMaster-Installer
        path: build/LoanMasterSetup.exe
