name: CI

on:
  push:
    branches: [ "main", "feature/professional-workflows" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain the workspace is written for (rust-version in Cargo.toml).
  # Raised deliberately: a newer clippy can bring new lints.
  RUST_TOOLCHAIN: "1.95"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: clippy

    - uses: Swatinem/rust-cache@v2

    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Test
      run: cargo test --workspace --locked

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}

    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release --locked -p loanmaster

    - name: Check that the program starts
      run: |
        # Windows refuses to start a program that imports a function it
        # cannot find (the first 2.0 builds asked comctl32 for
        # TaskDialogIndirect), which building alone does not show.
        $p = Start-Process target/release/loanmaster.exe -ArgumentList '--version' -RedirectStandardOutput version.txt -PassThru
        $null = $p.Handle
        if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'LoanMaster did not exit within a minute of starting.' }
        if ($p.ExitCode -ne 0) { throw ('LoanMaster could not start: exit code 0x{0:X8}' -f $p.ExitCode) }
        Get-Content version.txt

    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress
        echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

    - name: Build Installer (Inno Setup)
      run: iscc setup.iss

    - name: Collect the portable copy
      run: |
        New-Item -ItemType Directory -Force build/LoanMaster | Out-Null
        Copy-Item target/release/loanmaster.exe build/LoanMaster/LoanMaster.exe

    - name: Upload Artifact - Portable Folder
      uses: actions/upload-artifact@v7
      with:
        name: LoanMaster-Portable
        path: build/LoanMaster

    - name: Upload Artifact - Installer
      uses: actions/upload-artifact@v7
      with:
        name: LoanMaster-Installer
        path: build/LoanMasterSetup.exe

    - name: Test installed application and journal engine
      shell: pwsh
      run: |
        $dir = Join-Path $env:RUNNER_TEMP 'InstalledLoanMaster'
        $installer = Start-Process build/LoanMasterSetup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$dir`"" -Wait -PassThru
        if ($installer.ExitCode) { throw 'Installation failed' }
        python -c "import sqlite3,pathlib; c=sqlite3.connect('sample.db'); c.executescript(pathlib.Path('crates/core/src/schema.sql').read_text(encoding='utf8')); c.close()"
        if ($LASTEXITCODE) { throw 'Could not prepare sample journal' }
        $app = Start-Process "$dir/LoanMaster.exe" -ArgumentList '--journal-self-test sample.db' -Wait -PassThru
        if ($app.ExitCode) { throw 'Installed journal self-test failed' }

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        path: artifacts
    - name: Publish versioned Windows downloads
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -eu
        cp artifacts/LoanMaster-Installer/LoanMasterSetup.exe "LoanMaster-Setup-$TAG.exe"
        cp artifacts/LoanMaster-Portable/LoanMaster.exe "LoanMaster-Portable-$TAG.exe"
        sha256sum "LoanMaster-Setup-$TAG.exe" "LoanMaster-Portable-$TAG.exe" > SHA256SUMS.txt
        gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "LoanMaster-Setup-$TAG.exe" "LoanMaster-Portable-$TAG.exe" SHA256SUMS.txt
